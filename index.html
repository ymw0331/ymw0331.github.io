<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Immediate redirect -->
    <meta http-equiv="refresh" content="0; url=https://wayney.dev">
    
    <!-- SEO Meta Tags -->
    <title>Wayne Yong | Portfolio Has Moved</title>
    <meta name="description" content="Wayne Yong's portfolio has moved to wayney.dev. You will be redirected automatically.">
    <link rel="canonical" href="https://wayney.dev" />
    
    <!-- Open Graph for social media -->
    <meta property="og:title" content="Wayne Yong | Full Stack Developer" />
    <meta property="og:description" content="Portfolio has moved to wayney.dev" />
    <meta property="og:url" content="https://wayney.dev" />
    <meta property="og:type" content="website" />
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        a {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        a:hover {
            transform: translateY(-2px);
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <script>
        // JavaScript redirect with path preservation
        (function() {
            const currentPath = window.location.pathname;
            const currentHash = window.location.hash;
            const currentSearch = window.location.search;
            
            // Build the new URL
            let newUrl = 'https://wayney.dev';
            
            // Preserve path if not root
            if (currentPath && currentPath !== '/' && currentPath !== '/index.html') {
                newUrl += currentPath;
            }
            
            // Preserve query parameters
            if (currentSearch) {
                newUrl += currentSearch;
            }
            
            // Preserve hash
            if (currentHash) {
                newUrl += currentHash;
            }
            
            // Redirect
            window.location.replace(newUrl);
        })();
    </script>
</head>
<body>
    <div class="container">
        <h1>📍 Portfolio Moved!</h1>
        <p>
            Redirecting to wayney.dev
            <span class="spinner"></span>
        </p>
        <p style="font-size: 1rem; opacity: 0.7;">
            If you're not redirected automatically,
        </p>
        <a href="https://wayney.dev">Click here to visit wayney.dev</a>
    </div>
</body>
</html>
